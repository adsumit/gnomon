[package]
name = "gnomon-gtk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gnomon"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
async-channel = "2.5.0"
chrono = "0.4.45"
gnomon-core = { version = "0.1.0", path = "../gnomon-core" }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2.189"
serde_json = "1.0.151"
